name: Deploy

# Déploie en poussant la référence choisie sur la branche `production`, que la
# ressource Coolify suit. C'est l'App GitHub déjà installée qui fait le reste :
# elle reçoit l'événement `push` et déclenche le déploiement. Aucun jeton d'API
# Coolify, donc aucun secret à créer — voir work/coolify-deploy.md.
#
# Déclenchement **manuel uniquement**, et c'est délibéré : la ressource est en
# source git, donc Coolify recompile le Dockerfile sur une machine à 4 Go qui
# s'est effondrée deux fois pendant un build. On déploie à froid, en regardant.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag ou branche à déployer (défaut : main)"
        type: string
        default: main

# Deux déploiements simultanés sur la même machine, c'est l'incident assuré.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Le seul droit nécessaire : pousser la branche de déploiement.
permissions:
  contents: write

env:
  DEPLOY_BRANCH: production
  APP_URL: https://penduline.polemil.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://penduline.polemil.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # Historique complet : on veut pouvoir résumer l'écart déployé.
          fetch-depth: 0

      - name: Résumer ce qui part
        run: |
          set -euo pipefail
          echo "Déploiement de $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s)"
          git fetch origin "$DEPLOY_BRANCH" --quiet 2>/dev/null || true
          if git rev-parse --verify --quiet "origin/$DEPLOY_BRANCH" >/dev/null; then
            echo "### Commits déployés" >> "$GITHUB_STEP_SUMMARY"
            git log --oneline "origin/$DEPLOY_BRANCH..HEAD" >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "Première publication sur \`$DEPLOY_BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Le bundle est servi sous un nom haché par Vite : si ce nom change après
      # le déploiement, c'est la preuve qu'un nouveau conteneur sert vraiment.
      # Sans ce repère, un « ça répond 200 » se contenterait de l'ancien.
      - name: Relever le bundle actuellement servi
        id: avant
        run: |
          set -euo pipefail
          bundle=$(curl -sS "$APP_URL/" | grep -o 'assets/index-[^"]*\.js' | head -1 || true)
          echo "bundle servi avant déploiement : ${bundle:-inconnu}"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      # Force delibéré : `production` est un pointeur vers ce qui tourne, jamais
      # une branche de travail. Un rollback la fait légitimement reculer.
      - name: Publier sur la branche de déploiement
        run: git push --force origin "HEAD:refs/heads/$DEPLOY_BRANCH"

      - name: Attendre le nouveau bundle
        # 40 × 15 s = 10 min. Un build web prend ~2 min ; au-delà, la machine rame.
        timeout-minutes: 12
        env:
          AVANT: ${{ steps.avant.outputs.bundle }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 40); do
            sleep 15
            code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/" || true)
            [ "$code" = "200" ] || { echo "statut HTTP $code, le conteneur redémarre sans doute…"; continue; }
            bundle=$(curl -sS "$APP_URL/" | grep -o 'assets/index-[^"]*\.js' | head -1 || true)
            if [ -n "$bundle" ] && [ "$bundle" != "$AVANT" ]; then
              echo "Nouveau bundle servi : $bundle"
              echo "Déployé : \`$bundle\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          # Un déploiement sans changement front produit un bundle identique :
          # c'est un cas légitime, on n'échoue pas dessus.
          echo "::warning::Le bundle servi n'a pas changé après 10 min. Normal si le déploiement ne touche pas le front — sinon, vérifie les logs dans l'UI Coolify."

      # Le seul échec dur : l'app ne répond plus. Le reste est informatif.
      - name: Vérifier que l'app répond
        run: |
          set -euo pipefail
          for _ in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/" || true)
            [ "$code" = "200" ] && { echo "$APP_URL répond 200."; exit 0; }
            echo "statut HTTP $code, nouvelle tentative…"
            sleep 10
          done
          echo "::error::L'app ne répond pas 200 après le déploiement."
          exit 1
