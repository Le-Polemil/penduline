name: Deploy

# Déploie en poussant la référence choisie sur la branche `production`, que la
# ressource Coolify suit. C'est l'App GitHub déjà installée qui fait le reste :
# elle reçoit l'événement `push` et déclenche le déploiement. Aucun jeton d'API
# Coolify, donc aucun secret à créer — voir work/coolify-deploy.md.
#
# Déclenchement **manuel uniquement**, et c'est délibéré : la ressource est en
# source git, donc Coolify recompile le Dockerfile sur une machine à 4 Go qui
# s'est effondrée deux fois pendant un build. On déploie à froid, en regardant.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag ou branche à déployer (défaut : main)"
        type: string
        default: main
      migrations:
        description: "Migrations Supabase : les appliquer avant le front, ou passer outre"
        type: choice
        default: auto
        options:
          - auto
          - ignorer

# Deux déploiements simultanés sur la même machine, c'est l'incident assuré.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Le seul droit nécessaire : pousser la branche de déploiement.
permissions:
  contents: write

env:
  DEPLOY_BRANCH: production
  APP_URL: https://penduline.polemil.dev

jobs:
  # ── Les migrations, AVANT le front ─────────────────────────────────────────
  #
  # L'ordre n'est pas une préférence : un front qui interroge une table absente
  # répond 404 sans rien dire, et c'est arrivé quatre fois de suite (#45, #39,
  # #50, #78). Le mettre ici le rend garanti par construction.
  #
  # La connexion passe par SSH, comme la procédure manuelle du README — mais la
  # clé est bornée par une COMMANDE FORCÉE côté hôte
  # (`apps/supabase/deploy/penduline-migrate.sh`) : elle ne donne pas de shell,
  # seulement « lister », « appliquer », « vérifier ».
  migrate:
    if: inputs.migrations == 'auto'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Pas d'action tierce pour trois lignes de `ssh` : ce job détient la clé
      # de la base de production, il n'a rien à emprunter à personne.
      - name: Préparer la connexion
        env:
          CLE: ${{ secrets.MIGRATE_SSH_KEY }}
          HOTES_CONNUS: ${{ secrets.MIGRATE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$CLE" ] || { echo "::error::Secret MIGRATE_SSH_KEY absent. Voir apps/supabase/README.md, ou relancer avec migrations=ignorer."; exit 1; }
          # `known_hosts` renseigné, jamais `StrictHostKeyChecking=no` : accepter
          # n'importe quelle empreinte reviendrait à livrer la clé au premier
          # qui se met en travers.
          [ -n "$HOTES_CONNUS" ] || { echo "::error::Secret MIGRATE_SSH_KNOWN_HOSTS absent (ssh-keyscan de l'hôte)."; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_migrate
          chmod 600 ~/.ssh/id_migrate
          printf '%s\n' "$HOTES_CONNUS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Comparer le dépôt et la base
        id: comparer
        env:
          HOTE: ${{ secrets.MIGRATE_SSH_HOST }}
          UTILISATEUR: ${{ secrets.MIGRATE_SSH_USER }}
          PORT: ${{ vars.MIGRATE_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh_hote() { ssh -q -i ~/.ssh/id_migrate -o IdentitiesOnly=yes -o BatchMode=yes -p "$PORT" "$UTILISATEUR@$HOTE" "$@"; }

          ssh_hote applied > /tmp/appliquees.txt
          echo "Versions déjà en base : $(wc -l < /tmp/appliquees.txt | tr -d ' ')"

          : > /tmp/en-attente.txt
          for f in apps/supabase/migrations/*.sql; do
            base=$(basename "$f" .sql)
            version=${base%%_*}
            nom=${base#*_}
            [[ "$version" =~ ^[0-9]{14}$ ]] || { echo "::error::Nom de fichier inattendu : $f"; exit 1; }
            grep -qx "$version" /tmp/appliquees.txt || printf '%s\t%s\t%s\n' "$version" "$nom" "$f" >> /tmp/en-attente.txt
          done

          nb=$(wc -l < /tmp/en-attente.txt | tr -d ' ')
          echo "nb=$nb" >> "$GITHUB_OUTPUT"

          if [ "$nb" -eq 0 ]; then
            echo "### Migrations — rien à appliquer" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ⚠️ Le garde-fou qui compte. Cette instance n'a pas été créée par le
          # CLI : si la table de suivi vient d'être créée, elle est vide — et
          # « vide » ne veut pas dire « base neuve », ça veut dire « historique
          # jamais suivi ». Réappliquer `init.sql` sur une base en service serait
          # l'incident. On s'arrête, et on demande une baseline explicite.
          if [ ! -s /tmp/appliquees.txt ]; then
            echo "::error::La base ne déclare AUCUNE migration appliquée. Si elle est en service, son historique n'a jamais été suivi : faites une baseline avant (voir apps/supabase/README.md)."
            exit 1
          fi

          {
            echo "### Migrations à appliquer ($nb)"
            cut -f1,2 /tmp/en-attente.txt | sed 's/\t/_/; s/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Appliquer
        if: steps.comparer.outputs.nb != '0'
        env:
          HOTE: ${{ secrets.MIGRATE_SSH_HOST }}
          UTILISATEUR: ${{ secrets.MIGRATE_SSH_USER }}
          PORT: ${{ vars.MIGRATE_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          # Une par une, dans l'ordre des versions, et on s'arrête à la première
          # qui tombe : la suivante suppose la précédente.
          sort -k1,1 /tmp/en-attente.txt | while IFS=$'\t' read -r version nom fichier; do
            echo "→ ${version}_${nom}"
            ssh -q -i ~/.ssh/id_migrate -o IdentitiesOnly=yes -o BatchMode=yes -p "$PORT" \
              "$UTILISATEUR@$HOTE" "apply $version $nom" < "$fichier"
          done

      # Lecture seule. Le propriétaire doit être `supabase_admin`, le RLS actif,
      # la policy présente — et surtout les droits de la nouvelle table
      # identiques à ceux des anciennes : c'est le seul des quatre contrôles qui
      # prouve que l'application pourra la lire.
      - name: Vérifier le schéma
        if: steps.comparer.outputs.nb != '0'
        env:
          HOTE: ${{ secrets.MIGRATE_SSH_HOST }}
          UTILISATEUR: ${{ secrets.MIGRATE_SSH_USER }}
          PORT: ${{ vars.MIGRATE_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          {
            echo "### Schéma après migration"
            echo '```'
            ssh -q -i ~/.ssh/id_migrate -o IdentitiesOnly=yes -o BatchMode=yes -p "$PORT" "$UTILISATEUR@$HOTE" verify
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: migrate
    # `migrations=ignorer` saute le job précédent : sans ceci, il emporterait le
    # déploiement avec lui.
    if: ${{ !cancelled() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://penduline.polemil.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # Historique complet : on veut pouvoir résumer l'écart déployé.
          fetch-depth: 0

      - name: Résumer ce qui part
        run: |
          set -euo pipefail
          echo "Déploiement de $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s)"
          git fetch origin "$DEPLOY_BRANCH" --quiet 2>/dev/null || true
          if git rev-parse --verify --quiet "origin/$DEPLOY_BRANCH" >/dev/null; then
            echo "### Commits déployés" >> "$GITHUB_STEP_SUMMARY"
            git log --oneline "origin/$DEPLOY_BRANCH..HEAD" >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "Première publication sur \`$DEPLOY_BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Le bundle est servi sous un nom haché par Vite : si ce nom change après
      # le déploiement, c'est la preuve qu'un nouveau conteneur sert vraiment.
      # Sans ce repère, un « ça répond 200 » se contenterait de l'ancien.
      - name: Relever le bundle actuellement servi
        id: avant
        run: |
          set -euo pipefail
          bundle=$(curl -sS "$APP_URL/" | grep -o 'assets/index-[^"]*\.js' | head -1 || true)
          echo "bundle servi avant déploiement : ${bundle:-inconnu}"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      # Force delibéré : `production` est un pointeur vers ce qui tourne, jamais
      # une branche de travail. Un rollback la fait légitimement reculer.
      - name: Publier sur la branche de déploiement
        run: git push --force origin "HEAD:refs/heads/$DEPLOY_BRANCH"

      - name: Attendre le nouveau bundle
        # 40 × 15 s = 10 min. Un build web prend ~2 min ; au-delà, la machine rame.
        timeout-minutes: 12
        env:
          AVANT: ${{ steps.avant.outputs.bundle }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 40); do
            sleep 15
            code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/" || true)
            [ "$code" = "200" ] || { echo "statut HTTP $code, le conteneur redémarre sans doute…"; continue; }
            bundle=$(curl -sS "$APP_URL/" | grep -o 'assets/index-[^"]*\.js' | head -1 || true)
            if [ -n "$bundle" ] && [ "$bundle" != "$AVANT" ]; then
              echo "Nouveau bundle servi : $bundle"
              echo "Déployé : \`$bundle\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          # Un déploiement sans changement front produit un bundle identique :
          # c'est un cas légitime, on n'échoue pas dessus.
          echo "::warning::Le bundle servi n'a pas changé après 10 min. Normal si le déploiement ne touche pas le front — sinon, vérifie les logs dans l'UI Coolify."

      # Le seul échec dur : l'app ne répond plus. Le reste est informatif.
      - name: Vérifier que l'app répond
        run: |
          set -euo pipefail
          for _ in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/" || true)
            [ "$code" = "200" ] && { echo "$APP_URL répond 200."; exit 0; }
            echo "statut HTTP $code, nouvelle tentative…"
            sleep 10
          done
          echo "::error::L'app ne répond pas 200 après le déploiement."
          exit 1
