name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Le Dockerfile ne lance plus `tsc` (il faisait tomber l'hôte de prod,
      # voir work/coolify-deploy.md) : c'est ICI que le typecheck doit tourner.
      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      # Le typecheck ne voit pas les défaillances silencieuses : un ordre qui
      # dérive ou une paire cassée ne lèvent aucune erreur de type.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  image:
    # L'image n'est construite et publiée que depuis `main`. C'est tout l'intérêt :
    # la machine de production ne compile plus rien, elle se contente d'un pull.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Vite inline les clés dans le bundle : sans elles, le build produit une
      # application muette qui affiche « Configuration Supabase manquante ».
      # On échoue franchement plutôt que de publier une image cassée.
      - name: Vérifier les variables de build
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          [ -n "$URL" ] || { echo "::error::VITE_SUPABASE_URL absente (Settings › Secrets and variables › Actions › Variables)"; exit 1; }
          [ -n "$KEY" ] || { echo "::error::VITE_SUPABASE_ANON_KEY absente (idem)"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Jeton fourni par Actions : aucun secret à créer.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          # Le serveur est en x86 ; les runners aussi, donc pas d'émulation.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/le-polemil/penduline-web:latest
            ghcr.io/le-polemil/penduline-web:${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
