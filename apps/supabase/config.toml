# Supabase — configuration du projet local (Supabase CLI).
# Doc : https://supabase.com/docs/guides/cli/config
# Le CLI cherche `supabase/config.toml` : lancer les commandes avec
# `--workdir apps` depuis la racine (voir apps/supabase/README.md).

project_id = "penduline"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

# Seed local appliqué à chaque `supabase db reset` (jamais sur remote).
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Attrape les emails envoyés en local (confirmations, magic links) — http://127.0.0.1:54324
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
# Vite prend le premier port libre à partir de 5173 : si 5173 est occupé, le
# `redirectTo` du parcours de réinitialisation vaudra 5174 et GoTrue le
# refuserait s'il n'était pas listé ici.
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5174"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
# Confirmation ACTIVE en local, pour refléter la production une fois le SMTP en
# place (cf. work/coolify-deploy.md). Sans coût de confort : Inbucket capture
# les mails sur http://127.0.0.1:54324, il n'y a jamais de vraie boîte à ouvrir.
# C'est aussi la seule façon de tester le parcours de réinitialisation en local.
enable_confirmations = true

[analytics]
enabled = false
