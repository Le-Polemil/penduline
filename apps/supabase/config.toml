# Supabase — configuration du projet local (Supabase CLI).
# Doc : https://supabase.com/docs/guides/cli/config
# Le CLI cherche `supabase/config.toml` : lancer les commandes avec
# `--workdir apps` depuis la racine (voir apps/supabase/README.md).

project_id = "penduline"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

# Seed local appliqué à chaque `supabase db reset` (jamais sur remote).
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Attrape les emails envoyés en local (confirmations, magic links) — http://127.0.0.1:54324
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
# Vite prend le premier port libre à partir de 5173 : si 5173 est occupé, le
# `redirectTo` du parcours de réinitialisation vaudra 5174 et GoTrue le
# refuserait s'il n'était pas listé ici.
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5174"]
# 1 h ne dit RIEN de la durée de connexion : c'est le refresh token qui la porte,
# et il n'expire pas (ni `sessions.timebox` ni `sessions.inactivity_timeout` ne
# sont posés ici). Volontairement PAS allongé — un JWT est validé hors ligne par
# PostgREST, qui n'a aucun moyen de savoir qu'il a été révoqué : sa durée est
# exactement la fenêtre pendant laquelle une déconnexion globale reste sans effet.
jwt_expiry = 3600
# ROTATION DÉSACTIVÉE — ne pas remettre à `true` sans lire work/session.md.
#
# Deux raisons, et la seconde interdit le retour en arrière :
#
# 1. La rotation révoque la famille de jetons dès qu'un jeton déjà échangé est
#    représenté hors de sa fenêtre de tolérance. Or l'app web et la PWA installée
#    partagent le MÊME localStorage : au réveil, deux contextes rafraîchissent
#    avec le même jeton, et tout le monde se retrouve devant l'écran de connexion.
# 2. Le partage de session web → extension (`packages/shared/src/extension-bridge.ts`)
#    fait vivre le même refresh token dans deux stockages distincts, qui dérivent
#    l'un de l'autre. Avec la rotation, ils se révoquent mutuellement.
#
# Le coût est réel et assumé : un refresh token volé reste valide jusqu'à la
# déconnexion. Il n'y a plus de détection de rejeu pour l'invalider.
enable_refresh_token_rotation = false
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
# Confirmation ACTIVE en local, pour refléter la production une fois le SMTP en
# place (cf. work/coolify-deploy.md). Sans coût de confort : Inbucket capture
# les mails sur http://127.0.0.1:54324, il n'y a jamais de vraie boîte à ouvrir.
# C'est aussi la seule façon de tester le parcours de réinitialisation en local.
enable_confirmations = true

[analytics]
enabled = false
