<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="2551 1902 8308 8308">
<!--
  Penduline : le « P » — une branche, deux feuilles, et le nid de la rémiz
  penduline qui y pend, avec la matrice 2×2 dedans.

  ⚠️ CE FICHIER N'EST PAS `icon.svg`, ET LES DEUX NE DESSINENT PAS LA MÊME CHOSE.
  `icon.svg` porte le nid plein, plus ancien : il reste la source des onze PNG
  dérivés (manifeste PWA, apple-touch) tant qu'on n'a pas de vecteur propre pour
  les grandes tailles. Celui-ci porte la marque de l'en-tête, et sert là où une
  petite taille suffit : le favicon, et les icônes d'extension (16 → 128).
  Voir `work/refonte-ecrans.md` et l'issue #151.

  Vectorisé depuis `logo.png`, qui reste le fichier de l'en-tête — le tracé est
  fidèle mais pas identique (les deux feuilles, l'ovale du nid).

  `viewBox` RECADRÉE sur la boîte englobante réelle du dessin (mesurée au
  `getBBox`) : les tracés n'occupaient que 5168 × 7988 d'un canevas de 12540, et
  à 16 px la marque se perdait dans le vide. Carrée, dimensionnée par la hauteur
  et centrée sur le dessin — elle remplit la tuile sans se déformer. Même
  correctif que `icon.svg`, pour la même raison.

  Les cinq teintes sont celles de `packages/shared/src/quadrants.ts` et du jeton
  d'accent : le tracé les avait fait dériver d'un ou deux points, et un logo qui
  n'est pas à la couleur du produit se voit en pastille à côté de l'application.
-->
