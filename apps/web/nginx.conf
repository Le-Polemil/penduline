server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les assets Vite sont hashés → cache long. index.html jamais mis en cache,
    # sinon un déploiement ne serait pas vu par les onglets déjà ouverts.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Le service worker n'est pas hashé : `location /assets/` ne le couvre pas, mais
    # rien ne l'empêcherait d'être mis en cache par un intermédiaire. Or un service
    # worker mis en cache est impossible à corriger à distance — il continuerait
    # d'être servi bien après le déploiement du correctif.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # `default_type` explicite : le mapping MIME de `.webmanifest` n'est pas garanti
    # par le mime.types de l'image `nginx:alpine`, et un manifeste servi en
    # `application/octet-stream` est ignoré par le navigateur.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
