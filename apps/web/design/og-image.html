<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Source de apps/web/public/og-image.png (1200×630), l'aperçu des liens (Open Graph). À régénérer depuis la racine du dépôt :
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --screenshot=apps/web/public/og-image.png file://$PWD/apps/web/design/og-image.html -->
<style>
  @font-face { font-family: 'Caprasimo'; src: url('../public/fonts/caprasimo-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Figtree'; font-weight: 400 700; src: url('../public/fonts/figtree-latin.woff2') format('woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f5ead8; color: #201e1d; font-family: 'Figtree', sans-serif; display: grid; grid-template-columns: 1fr 400px; align-items: center; padding: 0 92px; box-sizing: border-box; position: relative; }
  body::before { content: ''; position: absolute; inset: 28px; border-radius: 48px; background: #fdf6e9; box-shadow: 0 0 0 3px #c67139; }
  .text, .mark { position: relative; }
  h1 { font: 400 140px/1 'Caprasimo', serif; margin: 0 0 28px; }
  p { font-size: 40px; line-height: 1.3; font-weight: 600; color: #474238; margin: 0; max-width: 580px; }
  .url { position: absolute; left: 92px; bottom: 64px; font-size: 28px; font-weight: 700; color: #8c491a; letter-spacing: .02em; }
  .mark img { width: 400px; display: block; }
</style>
</head>
<body>
  <div class="text">
    <h1>Penduline</h1>
    <p>Vos tâches en matrices d'Eisenhower, une par contexte.</p>
  </div>
  <div class="mark"><img src="../public/icon.svg" alt=""></div>
  <span class="url">penduline.zozios.app</span>
</body>
</html>
