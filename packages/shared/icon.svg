<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="11.75 5.5 88.5 88.5">
<!--
  Penduline : nid suspendu de la rémiz penduline, avec la matrice 2x2 dedans.
  Terracotta = la couleur d'accent du thème ; les 4 tuiles reprennent les teintes
  « bg » des quadrants de packages/shared/src/quadrants.ts, dans l'ordre de la
  matrice : faire (vert) / planifier (bleu) puis déléguer (or) / éliminer (rouge).
  Le coin de chaque tuile tourné vers le centre reste carré.

  viewBox recadrée sur la boîte englobante réelle du dessin (mesurée au getBBox) :
  les tracés occupent 56x88.5 dans un canevas de 112, d'où d'énormes marges.
  Carrée et centrée sur x=56 -> remplit le viewport sans déformation, contrainte
  par la hauteur.

  Sans contour : le détourage crème d'une version antérieure apparaissait en halo
  clair sur les fonds sombres.
-->
  <path d="M48 10 C48 4 64 4 64 10 L62 24 C60 30 52 30 50 24 Z" fill="#c67139"></path>
  <path d="M56 20 C39 20 28 36 28 56 C28 76 39 94 56 94 C73 94 84 76 84 56 C84 36 73 20 56 20 Z" fill="#c67139"></path>
  <path d="M45.5 40.5 L49.5 40.5 A5 5 0 0 1 54.5 45.5 L54.5 55.5 L44.5 55.5 A5 5 0 0 1 39.5 50.5 L39.5 46.5 A6 6 0 0 1 45.5 40.5 Z" fill="#dbe3ce"></path>
  <path d="M62.5 40.5 L66.5 40.5 A6 6 0 0 1 72.5 46.5 L72.5 50.5 A5 5 0 0 1 67.5 55.5 L57.5 55.5 L57.5 45.5 A5 5 0 0 1 62.5 40.5 Z" fill="#dde7ef"></path>
  <path d="M44.5 58.5 L54.5 58.5 L54.5 68.5 A5 5 0 0 1 49.5 73.5 L45.5 73.5 A6 6 0 0 1 39.5 67.5 L39.5 63.5 A5 5 0 0 1 44.5 58.5 Z" fill="#f2e0c4"></path>
  <path d="M57.5 58.5 L67.5 58.5 A5 5 0 0 1 72.5 63.5 L72.5 67.5 A6 6 0 0 1 66.5 73.5 L62.5 73.5 A5 5 0 0 1 57.5 68.5 Z" fill="#e3d8d4"></path>
</svg>
